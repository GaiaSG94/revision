name: prewarm

# Proxy pre-warm (idea 3): Modal scales to zero after 60 s of inactivity
# and a cold container takes 3 to 5 s to answer — measured on 11/11, when
# the app's health probe (5 s timeout) wrongly reported "model unavailable".
#
# A ping every 5 minutes keeps a container warm, so the first analysis
# of a visitor no longer pays for startup. Runs on a hosted runner
# (free for a public repo) to avoid occupying self-hosted runners.
#
# No key is needed: /health does not touch InferHub.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prewarm
  cancel-in-progress: true

jobs:
  prewarm:
    name: prewarm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Proxy ping
        shell: bash
        run: |
          set -uo pipefail
          URL="${{ vars.REVISION_PROXY_URL }}"
          SANTE="${URL%/analyze}/health"
          echo "probe: $SANTE"
          for essai in 1 2 3; do
            code=$(curl -s -o /tmp/response.json -w '%{http_code}' --max-time 30 "$SANTE" || echo 000)
            echo "attempt $essai: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          cat /tmp/response.json || true
          # Never red: a failed pre-warm must not block a PR or alert.
          exit 0
