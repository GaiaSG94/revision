name: triage-rouge

# Automatic triage of a red test, then repair with a hint.
#
# Seen on 01/11 (PR #919): `ci-app` failed on `ProbeStairsPriorityTest`,
# a class the PR did not touch — the culprit was the PR's new test, which
# left dirty session globals. The sweeper called the repair agent twice;
# without a diagnosis it returned 'budget exceeded' (150 s) and the PR
# stayed blocked for half an hour over one line to add.
#
# Here, before the agent: `tools/triage_test.py` (read from `main`, never
# the PR — a judge does not write itself into the record) outputs the failed
# class, matches it to the diff, and reruns it ALONE. Green alone = an
# order dependency between tests, not the PR code; PR tests that publish
# frames are named as suspects. The agent receives this verdict as a hint.
#
# Merge gate: none. This workflow only informs and proposes a fix; only
# green CI merges. It stays green whatever happens, so as never to add a
# red check on top of a red one.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Replay triage manually (after a specific red run): same path.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to triage"
        required: true
        type: string
      run:
        description: "Failed CI run id"
        required: true
        type: string
      reparer:
        description: "Call the repair agent (uncheck for a dry run)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  # One pass per head: a cancelled run must not triage twice.
  group: triage-rouge-${{ github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: true

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # non-PR: triage + isolated rerun + fw agent (~150 s)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_ECRITURE: ${{ secrets.AUTOMERGE_PAT }}
      REPO: ${{ github.repository }}
      PR: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
      RUN_ID: ${{ inputs.run || github.event.workflow_run.id }}
      TEST_AGENT: ${{ vars.TEST_AGENT }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      FIREWORKS_MODEL: ${{ vars.FIREWORKS_MODEL }}
      FIREWORKS_BASE_URL: ${{ vars.FIREWORKS_BASE_URL }}
    steps:
      - name: Context (head, marker already set?)
        id: ctx
        run: |
          set -uo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH" # gh + jq: r630 in user space
          # `bash -e` drives this block: every read that may return nothing is
          # explicitly neutralised (otherwise `grep -c` with no match exits 1
          # and fails the step — seen on the first dry run, 01/11).
          SHA="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha || true)"
          BRANCH="$(gh api "repos/$REPO/pulls/$PR" --jq .head.ref || true)"
          if [ -z "${SHA:-}" ]; then echo "PR #$PR not found, nothing to do"; exit 0; fi
          DEJA="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[].body' 2>/dev/null | grep -cF "<!-- triage sha=$SHA -->" || true)"
          DEJA="${DEJA:-0}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          printf 'triage of PR #%s (head %s), marker already set: %s\n' \
            "$PR" "${SHA:0:7}" "${DEJA:-0}"
          if [ "${DEJA:-0}" -gt 0 ]; then echo "pret=0" >> "$GITHUB_OUTPUT"
          else echo "pret=1" >> "$GITHUB_OUTPUT"; fi

      - name: PR head in the tree
        if: steps.ctx.outputs.pret == '1'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.sha }}
          fetch-depth: 1
          # No persisted credentials: otherwise checkout writes an
          # http.extraheader (GITHUB_TOKEN) that overrides the PAT in
          # test_agent.py's push URL → push refused for the bot.
          persist-credentials: false

      # No Gradle cache: docs repo without a build (the setup-gradle step
      # required a java missing from the runner and made triage fail).

      # The failed run log, the PR diff, and triage: triage is taken
      # from `main` (the PR does not judge its own failure).
      - name: Triage (failed class, scope, isolated rerun)
        id: tri
        if: steps.ctx.outputs.pret == '1'
        run: |
          set -uo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH" # gh + jq: r630 in user space
          gh api "repos/$REPO/contents/tools/triage_test.py" \
            -H 'Accept: application/vnd.github.raw' > /tmp/triage.py \
            || { echo "triage not found on main, nothing to do"; exit 0; }
          gh run view "$RUN_ID" --log-failed > /tmp/run.log 2>/dev/null || true
          gh pr diff "$PR" --name-only > /tmp/diff.txt 2>/dev/null || true
          wc -l /tmp/run.log /tmp/diff.txt
          code=0
          python3 /tmp/triage.py --log /tmp/run.log --diff /tmp/diff.txt \
            --racine "$GITHUB_WORKSPACE" --verifier --json /tmp/verdict.json \
            > /tmp/triage.txt 2>&1 || code=$?
          echo "--- triage (code $code) ---"; cat /tmp/triage.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: PR report (once per head)
        if: steps.ctx.outputs.pret == '1'
        run: |
          set -uo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH" # gh + jq: r630 in user space
          # Without `tools/triage_test.py` on main, the Triage step exits before
          # writing `/tmp/triage.txt`: an empty report rather than a failing
          # `sed` (the job would stay red and repair would not start).
          [ -s /tmp/triage.txt ] || printf '(triage unavailable: `tools/triage_test.py` missing from `main` — verdict: unknown)\n' > /tmp/triage.txt
          SHA="${{ steps.ctx.outputs.sha }}"
          GENRE="$(python3 -c 'import json;print(json.load(open("/tmp/verdict.json"))["genre"])' 2>/dev/null || echo unknown)"
          cas() {
            case "$1" in
              pollution) echo "pollution-inter-tests" ;;
              perimetre) echo "pr-test" ;;
              *) echo "out-of-scope-test" ;;
            esac
          }
          LABEL="$(cas "$GENRE")"
          {
            echo "<!-- triage sha=$SHA -->"
            echo "_automatic triage · \`tools/triage_test.py\` (verdict: **$GENRE**)_"
            echo
            sed -n '1,40p' /tmp/triage.txt
            echo
            echo "The merge queue does not rerun a red test: a fix is needed. The repair agent is called with this verdict as a hint; only green CI will merge."
          } > /tmp/corps.md
          GH_TOKEN="$GH_ECRITURE" gh label create "$LABEL" --repo "$REPO" \
            -c ededed -d "automatic triage of a red test" >/dev/null 2>&1 || true
          GH_TOKEN="$GH_ECRITURE" gh pr comment "$PR" --repo "$REPO" \
            --body-file /tmp/corps.md >/dev/null 2>&1 \
            && echo "report posted (label $LABEL)" || echo "report refused"
          GH_TOKEN="$GH_ECRITURE" gh pr edit "$PR" --repo "$REPO" \
            --add-label "$LABEL" >/dev/null 2>&1 || true

      # Repair: same driver as the sweeper, but with the triage hint
      # (this is what was missing on 01/11 — the agent searched blindly).
      - name: Repair with hint (bounded agent, once per head)
        if: >-
          steps.ctx.outputs.pret == '1' && steps.tri.outputs.code != '3' &&
          (github.event_name != 'workflow_dispatch' || inputs.reparer)
        run: |
          set -uo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH" # gh + jq: r630 in user space
          if [ "${TEST_AGENT:-1}" = "0" ]; then
            echo "TEST_AGENT=0: repair disabled"; exit 0
          fi
          gh api "repos/$REPO/contents/.github/fireworks/test_agent.py" \
            -H 'Accept: application/vnd.github.raw' > /tmp/agent.py || exit 0
          python3 /tmp/agent.py fix --repo "$REPO" --pr "$PR" \
            --branch "${{ steps.ctx.outputs.branch }}" \
            --sha "${{ steps.ctx.outputs.sha }}" \
            --indice /tmp/triage.txt || true
