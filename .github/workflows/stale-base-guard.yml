name: stale-base-guard (informational)

# [HERMES-REFRESH] Port of the stale-base-guard from the duello repo.
# Falling behind main is INFORMATIONAL: warning + exit 0. The gate
# (hermes-lite.yml) refreshes the branch via the API at merge time.
# If the repo makes this check 'required' in branch protection,
# it stays green on a simple lag: only a real conflict blocks.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stale-base-guard-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  guard:
    name: stale-base-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure how far behind the base
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || '' }}"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['sha'])")
          fi
          BEHIND=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD_SHA}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('behind_by', 0))")
          echo "behind=${BEHIND} base=${BASE}" >> "$GITHUB_OUTPUT" || true
          if [ "$BEHIND" -gt 0 ]; then
            echo "::warning::Branch is behind by ${BEHIND} commit(s) on ${BASE} (informational: hermes-lite refreshes it automatically at merge time)."
          fi
          exit 0
