name: ci-budget (≤ 5 min)

# User rule 2026-10-24: all CI must give its verdict within 5 min.
# This workflow is a configuration guard, not an application test:
# it fails if a job declares more than 5 minutes (or no timeout).
# It runs on every PR so that the `ci-budget` check always exists
# (Mergify queue condition) — cost: a few seconds.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-budget:
    name: ci-budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Shallow checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check the 5 min budget per job
        run: python3 .github/ci-budget/check_timeouts.py