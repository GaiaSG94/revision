name: latence

# Hourly reading of upstream latency and availability (idea 10 of the
# "staying on InferHub" brainstorm).
#
# Three uses: choose the video filming time from data rather than
# intuition, prove availability during judging (RNF-08), and honestly
# document the constraint of an upstream that is a marketplace.
#
# The reading is published on the `donnees/latence` branch: `main` is
# protected by a ruleset (PR required), an automatic push would be refused.
#
# The job must NEVER be red: a failed reading must not trigger
# an alert nor break anything.
on:
  schedule:
    # Offset minute from usual hourly crons, to avoid bursts.
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: latence
  cancel-in-progress: true

jobs:
  relever:
    name: Measure upstream latency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Probe
        shell: bash
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
        run: |
          set -uo pipefail
          node scripts/sonder-latence.mjs || echo "probe skipped"

      - name: Publish to the data branch
        shell: bash
        env:
          PAT: ${{ secrets.AUTOMERGE_PAT }}
        run: |
          set -uo pipefail
          [ -f docs/LATENCE.md ] || { echo "no reading to publish"; exit 0; }
          git config user.name "GaiaSG94"
          git config user.email "290536685+GaiaSG94@users.noreply.github.com"
          BRANCHE="donnees/latence"
          # We NEVER force: one commit per hour on the data branch,
          # the readings history stays readable. (A forced push would be
          # refused by the `couche0` guard.)
          cp docs/LATENCE.md /tmp/LATENCE.md 2>/dev/null || true
          git fetch origin "$BRANCHE" 2>/dev/null || true
          if git rev-parse --verify "origin/$BRANCHE" >/dev/null 2>&1; then
            git checkout -B "$BRANCHE" "origin/$BRANCHE"
          else
            git checkout --orphan "$BRANCHE"
            git rm -rf --quiet . || true
          fi
          mkdir -p docs
          [ -f /tmp/LATENCE.md ] && cp /tmp/LATENCE.md docs/LATENCE.md
          git add -f docs/LATENCE.md || true
          git commit -m "latency: hourly reading $(date -u +%FT%TZ)" || echo "nothing to publish"
          git push "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git" "$BRANCHE:$BRANCHE" \
            || echo "publishing failed (branch will be updated on next pass)"
          exit 0
