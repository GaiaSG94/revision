name: pages

# Deployment of the static webapp to GitHub Pages (public HTTPS URL,
# free). This workflow is not a PR check: it only runs on
# `main` and on demand. 5 min budget like everything else.
#
# The InferHub key is never here: the site calls either the edge proxy
# (`/api/analyze`), InferHub via BYOK (open CORS), or demo mode
# (recorded answers on the corpus).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Node tooling
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Dependencies
        shell: bash
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build (base Pages)
        shell: bash
        env:
          VITE_BASE: /revision/
          VITE_PROXY_URL: ${{ vars.REVISION_PROXY_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
