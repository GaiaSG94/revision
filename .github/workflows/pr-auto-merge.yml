# pr-auto-merge — automatic merge queue: every internal PR is
# rebased onto main when behind (BEHIND) or in conflict (DIRTY); ready PRs
# are merged (rebase) as soon as the 3 required checks are green.
# The only gate remains CI; no human gate.
# v29 (10/11): reading `mergeable_state` waits for the flapping (~2 min)
# opened by the run's own check-runs to settle, and `UNSTABLE` joins the
# 10 min retry window (near_probe-autosetup probe PR #6, frozen on 5
# transient readings).
# v4 (2026-10-27): real rebase (not a merge bubble) via PAT (secret
# AUTOMERGE_PAT) — GITHUB_TOKEN is not enough (no auto-merge, no pushes that
# restart CI: ghost `action_required` runs). Without the secret, pause
# cleanly instead of failing. Pushed with a lease: never overwrite an
# author's push that arrived in the meantime. Forks excluded; drafts rebased
# and reconciled but never merged.
# Conflicts (v5, 2026-10-28): the Fireworks agent tries to resolve them
# (.github/fireworks/conflict_agent.py, MiniMax M3.1 Flash model): conflict by
# conflict resolution, end of rebase, push with a lease, report on the PR.
# Without the FIREWORKS_API_KEY secret, we skip as before and the author
# rebases onto main. Circuit breaker: repo variable FIREWORKS_AGENT_RESOLVE=0.
# Draft conflicts (v6, 2026-10-28): the sweep also handles drafts
# (rebase + Fireworks agent) without ever merging them, and DIRTY like
# BEHIND — CI is the only resolution path (no local janitor).
# Push auth (v7, 2026-10-28): PAT in the URL (x-access-token) instead of the
# gh helper, which returns 403 "denied" on runners while the API can write.
# Parallel (v8, 2026-10-28): matrix — one job per PR (8 max), each with
# its own clone. Runs stay serialised (concurrency group); within a run,
# rebase + resolutions + merges advance in parallel. Isolated failures
# (fail-fast: false), pushes always with a lease.
# Latency (v9, 2026-10-28): the sweep also starts at every CI completion
# (`workflow_run` on `CI`) instead of waiting for the 10 min cron (kept as
# a fallback); `sleep 60` becomes a bounded poll of 6 × 5 s; `green()`
# now requires only `ci`, `ci-budget` and `couche0` (the native one is
# checked on main by `ci-native.yml`, protection reduced to these 3 checks).
# Retry (v10, 2026-10-29): `BLOCKED` is no longer "nothing to do" — that was
# the hole letting an author's PR rot indefinitely (Gaïa's PR #215: `couche0`
# red on a missing `## Scope`, so never retried or merged).
# Now, for a blocked PR:
#   - `ci` / `ci-budget` checks dropped for infrastructure (lost job,
#     checkout, cache, runner) → failed jobs retried, at most twice per head,
#     marker in a comment: never a loop;
#   - real failure (red test step) → no useless retry, a comment says which
#     step is at fault, once per head;
#   - `couche0` red on scope → the scope agent
#     (.github/fireworks/scope_agent.py) writes the missing declaration from
#     the diff and verifies it with main's guard BEFORE writing the body
#     (the guard is not loosened: undeclared file and useless declaration
#     remain refused); editing the body restarts `couche0`;
#   - `UNKNOWN`: bounded poll (4 × 5 s) instead of giving up immediately.
#   `workflow_run` also listens to `couche0` to continue without waiting for cron.
# Smoothness (v11, 2026-10-29) — measured on 153 runs on 29/10: 96 cancelled
# (63%), 92 triggered by `workflow_run` for 52 PR pushes, and the same pair
# (head, base) swept 3 times (CI finished, couche0 finished, cron). Three cuts:
#   - no more broad `pull_request` trigger: on a PR push, no check exists yet,
#     the sweep could do nothing (empty matrix, wasted run). `ready_for_review`
#     remains (draft → ready: that is when we want to merge);
#   - **one sweep per pair** (PR head, base, merge state, check fingerprint):
#     a fingerprint in a single comment, updated in place (not one comment
#     per pass). When checks pass, the state changes (BLOCKED → CLEAN) — or a
#     check changes verdict — and the next sweep is real work;
#   - fallback cron moved from 10 to 15 min, then back to `*/5` (History v11):
#     `workflow_run` stays the fast path, and `ci-budget` joined `ci.yml`,
#     so two triggers are enough.
# Merge queue — state as of 29/10 (v15).
#
# Role: every internal PR is pushed toward merge without a human hand. The
# only gate remains CI; the three required checks are `ci`, `ci-budget` and
# `couche0`.
#
# Two regimes:
#   1. **Active queue** (`MERGIFY_QUEUE=1` in repo variables, or a
#      `merge_queue` rule if the repo ever gets that right): the queue enqueues
#      PRs, updates them against `main` and replays checks on the batch's
#      merged tree. The sweeper no longer merges or rebases; it keeps only
#      what a queue cannot do — conflict (`DIRTY`, rebase + Fireworks agent),
#      infrastructure outage (`BLOCKED`, bounded retry), and **non-linear
#      branch** (v16): a PR that merged `main` instead of rebasing it is not
#      `BEHIND`, the queue takes it then GitHub refuses its rebase-merge
#      (`GITHUB_REBASE_MERGE_REFUSED`); we linearise it first.
#   2. **No queue**: old full path — rebase `BEHIND` PRs, merge when the three
#      checks are green, retry infrastructure failures.
#
# Why not GitHub's queue: it requires a public repo owned by an
# **organisation**; this one belongs to a user account and the API refuses
# the `merge_queue` rule (422). Mergify holds the queue (`.mergify.yml`,
# batches of 3). `mergify queue status` and `@mergifyio queue` answer
# "product to activate" until the dashboard does so — hence the
# `MERGIFY_QUEUE` switch, set that day so the sweeper could step aside
# without a redeploy.
#
# Short history:
#   v11 dedup by (head, base, state, check fingerprint) + 5 min cron;
#   v12 direct merge of green `BEHIND` PRs when the repo allows it;
#   v13 stopped collective rebase (only one PR prepared) — the ruleset has
#       `strict_required_status_checks_policy: true`, so every merge
#       invalidated the CI of all other PRs (O(N²), 15 merges/h);
#   v14 queue wiring (merge_group, then Mergify queue branch);
#   v15 queue takes over, sweeper steps aside (`MERGIFY_QUEUE`);
#   v16 `BLOCKED` on cancelled run: the `cancel` bucket is not `fail`
#       (real case: #434, CI run cancelled with no replacement, PR blocked
#       forever) — the whole run is replayed, at most twice per head.
#   v27 (31/10) wake-ups: `couche0` no longer triggers the sweep. It ends
#       ~9 s after a push, `CI` ~115 s: its wake-up always came before the
#       verdict and could only report "CI in progress". Measured from 20:10
#       to 22:10: 41 `couche0` endings for 21 `CI` runs — half the window's
#       sweeps for nothing. The two cases it still covered are handled
#       elsewhere: a red `couche0` arrives via the end of `CI` on the same
#       head, a lone re-armed `couche0` (rewritten `## Scope` block) arrives
#       via `pull_request: edited`.
#   v26 (31/10) coverage of actionable states: the targeted sweep always
#       includes `DIRTY`/`BLOCKED`/`DRAFT` PRs — a targeted run cancelled by a
#       concurrency burst would otherwise leave its head without a wake-up
#       (#652).
#   v27 (31/10) race-free retry + verdict read as GitHub reads it:
#       (a) `checks_pr` broke ties between two runs of the same check by
#       `started_at`, whereas GitHub attaches a required check to the
#       **most recent suite** (the newest run). When a cancelled `couche0`
#       lived next to an older green one, the sweeper believed the PR green
#       and fixed nothing (#702: BLOCKED 20 min with all checks green). We
#       now break ties by run id, then attempt start.
#       (b) a retry no longer starts while a suite of the **same** workflow
#       is starting on the same head: `concurrency` would cancel the fresh
#       suite, and its `cancelled` (newer run than the green one) became the
#       verdict GitHub and Mergify read — PR blocked with no red at all,
#       permanently (#702: couche0 green 20:32:26, cancelled 20:32:18 on run
#       41239350675 started by the status note's `edited`, killed by the
#       failed-run retry).
#   v25 (31/10) tooling: `test_agent.py` returns **3** when the runner has
#       neither `zeroclaw` nor its config — without setting its marker, so
#       the head's only attempt is not burned (#652: binary installed 2 min
#       too late).
#   v23 (31/10) drafts maintained: the `DRAFT` state was handled nowhere,
#       so a draft with red tests triggered neither retry nor agent. It now
#       follows the `BLOCKED` path (never merged, but repaired) and is excluded
#       from lifetime deduplication.
#   v22 (31/10) test repair: a REAL failure triggers the zeroclaw `fw` agent
#       (`test_agent.py`) — it reads the log, fixes in the clone and the driver
#       only pushes a bounded diff that compiles. One attempt per head,
#       circuit breaker variable `TEST_AGENT=0`. Before, a red test left the
#       PR to a human hand: that is what killed #615 for two hours.
#   v21 (31/10) states awaiting action: `DIRTY`, `BLOCKED` and `UNSTABLE`
#       are no longer deduplicated forever — v11 dedup froze them (same head,
#       same base, same checks) and a PR whose conflict agent failed once was
#       never picked up again (#634). New attempt at most every 10 min, per PR.
#   v20 (31/10) attributable failure: when the failing head was pushed by
#       the conflict agent (`<!-- agent-conflit sha=<head> -->`), the report
#       says the **resolution** broke it and sets the `intervention-humaine`
#       label. The agent's compilation gate (conflict_agent.py v3) makes
#       this rare; this net covers the skipped gate (tooling absent, timeout).
#   v17 (31/10) throughput: the sweeper no longer wakes for batch branches,
#       no longer wakes on a cancelled run, and clones only the PR that spoke.
#       Measured over 62 min (31/10, 2 p.m. → 3 p.m.): 291 runs of this
#       workflow, ~85% triggered by `CI`/`couche0` endings on
#       `mergify/merge-queue/**` branches, at 262 s of runner per run (matrix
#       = all open PRs, a 134 MB clone each) — ~85% of the 21-runner pool.
#       Measured consequence: a batch's checks waited 4 min 25 for a runner
#       (14:52:47 created → 14:57:12 started), a batch cost ~4.5 min instead
#       of ~90 s, and throughput capped at 11-19 merges/h. A cancelled run
#       teaches nothing: a cancelled check is not retried (v16 handles that
#       from the PR), so the sweep is skipped.
#   v21 (31/10) conflict agent: it pushes with the **PAT** (job's `GH_TOKEN`),
#       not with the installation token. A push by `@github-actions[bot]` does
#       not trigger workflows: they are born `action_required`, no required
#       check exists, the PR stays `BLOCKED` (seen on #634 at 16:46 — approved
#       manually). Independent safety net: `.github/workflows/auto-approve.yml`
#       approves every `action_required` run in the repo every 5 min (never a
#       fork run).
#   v27 (31/10) scope agent: same cause, same remedy — it edits the body
#       with the **PAT** (`GH_TOKEN="$GH_ECRITURE"` before `fw-scope.py`, like
#       the conflict agent in v21). Without it, the edit carries the
#       `@github-actions[bot]` identity, GitHub emits no `pull_request edited`,
#       and `couche0` never re-judges the corrected body: the PR stays `BLOCKED`
#       on a stale verdict while the scope is compliant (seen on #688: fix
#       written at 19:00, no `couche0` run behind it, unblocked manually by
#       `gh run rerun`). Net: when `couche0` fails and the scope marker is
#       already set for the head (fix written, stale verdict), the failed
#       `couche0` run is retried — once per head (`automerge-scope-rerun`
#       marker) — because the guard re-reads the current body via the API.
#       Non-regression: `InvocationSweepTest` in
#       `.github/fireworks/test_scope_agent.py` (CI already runs it).
#   v28 (01/11) real failure after retries: "2 retries already done, we stop"
#       also closed the fw agent's gate, and the word "scope" in the infra
#       regex classified the step "CI guard tests (conflicts, scope, …)" as
#       an outage to retry (seen #896: KeyError retried twice, never fixed).
#       The regex now keeps only real infra, and a real failure calls fw even
#       when retries are exhausted (one attempt per head, own marker). The
#       failure comment is factored out (`commenter_echec`), both branches
#       share it.

name: pr-auto-merge

on:
  # Only moments when the sweep can *do* something: broad `pull_request`
  # events (opened/synchronize/reopened) arrived before any check existed
  # (52 runs/day for nothing, measured on 29/10).
  # `edited` (v26, 31/10): a PR body rewrite — the `## Scope` block set by
  # the scope agent — re-arms `couche0` alone, without a new `CI`.
  # That was the only wake-up the end of `couche0` still provided; it is now
  # handled at the source, without waking the sweeper for nothing.
  pull_request:
    types: [ready_for_review, edited]
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    # `ci-budget` has been a job of `CI` since 29/10: `CI` covers the three
    # required checks. `couche0` is NO LONGER one (v26, 31/10): it ends ~9 s
    # after a push while `CI` takes ~115 s, so its wake-up always came before
    # the verdict — it could structurally only report "CI in progress".
    # Measured from 20:10 to 22:10: 41 `couche0` endings for 21 `CI` runs,
    # about half of the window's 69 sweeps.
    # What remains covered: a red `couche0` arrives via the end of `CI` on the
    # same head (it is later, even without a relation between the two jobs),
    # and a lone re-armed `couche0` arrives via `pull_request: edited`.
    workflows: ["CI"]
    types: [completed]

# Only one sweep at a time (v16), without cancellation.
#
# v12 split the group by (event, head) so a *pending* run would not be
# cancelled by another — that was right, but the fix had a cost that became
# visible on 31/10: every `CI` completion triggers a run, every run opens a
# matrix of 8 jobs, and runs overlap. Measured during a busy PR day: 15
# unfinished `pr-auto-merge` runs against 10 `CI` runs and 28 queued runs on
# a 21-runner pool — the sweep starved the CI it waits for, `ci-core` went
# from 2 to 5 minutes and queue batches neared their 20 min `checks_timeout`.
#
# A single group **without cancellation** solves this without losing work: a
# sweep anyway examines *all* open PRs (`discover` lists them), so two
# concurrent runs do the same work; serialising them only costs waiting, and
# the v11 fingerprint makes a run whose work is all done exit in seconds.
# `cancel-in-progress` stays `false`: cutting a run mid-rebase or mid-merge
# gains nothing and can leave a half-done push.
concurrency:
  group: pr-auto-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    # v17 — trigger filters, before even taking a runner:
    #   - a batch branch (`mergify/merge-queue/**`, `gh-readonly-queue/**`) is
    #     driven by the queue, not the sweeper: its `CI`/`couche0` completions
    #     must wake no sweep (that was ~85% of runs);
    #   - a `cancelled`/`skipped` run leaves no verdict to handle.
    if: ${{ github.event_name != 'workflow_run' || (!startsWith(github.event.workflow_run.head_branch, 'mergify/merge-queue/') && !startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/') && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      strict: ${{ steps.build.outputs.strict }}
      queue: ${{ steps.build.outputs.queue }}
    steps:
      - name: List open internal PRs
        id: build
        env:
          # v18 — reads with the installation token (own quota).
          # The PAT shares its 5000 GraphQL points/h with all agents;
          # when exhausted it made `discover` fail with
          # "API rate limit already exceeded" → "PR list unreadable —
          # queue paused" → NO PR entered the queue at all (seen on 31/10
          # from 15:00 to 15:25). Writes (comments, merges, retries,
          # pushes) keep the PAT: they carry its identity.
          GH_TOKEN: ${{ github.token }}
          # Admin reads (protection, rulesets): REST, the PAT's `core`
          # quota, which the sweep does not consume — and which the
          # installation token has no right to read.
          GH_ECRITURE: ${{ secrets.AUTOMERGE_PAT }}
          PAT_OK: ${{ secrets.AUTOMERGE_PAT != '' }}
          EVENT: ${{ github.event_name }}
          # v17 — the head that triggered the sweep (empty outside `workflow_run`).
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # Mergify queue switch. The ruleset cannot carry the `merge_queue`
          # rule (user repo, the API refuses it), so the queue's presence
          # cannot be read from the ruleset: this variable, set on the day
          # the product was enabled, says it.
          MERGIFY_QUEUE: ${{ vars.MERGIFY_QUEUE }}
        run: |
          set -euo pipefail
          # gh + jq: r630 in user space, Dell runners system-wide (127 seen 28/10 on revision-3)
          if [ "${PAT_OK:-false}" != "true" ]; then
            echo "AUTOMERGE_PAT missing: queue paused (see workflow header)"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = push ]; then
            # Let GitHub recompute states after landing:
            # bounded poll (6 × 5 s max, never a fixed sleep > 30 s).
            # We leave as soon as no PR is in a transient state.
            for _ in 1 2 3; do
              inconnus="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
                --jq '[.[] | select(.mergeable_state == null or .mergeable_state == "unknown")] | length' \
                2>/dev/null || echo 1)"
              if [ "${inconnus:-1}" = "0" ]; then break; fi
              sleep 5
            done
          fi
          # Does the repo require an up-to-date branch before merge? Classic
          # protection and the ruleset may disagree: we read both, the ruleset
          # wins (it is active on `main`).
          ghp() { GH_TOKEN="$GH_ECRITURE" gh "$@"; } # admin REST reads
          STRICT=$( { ghp api "repos/$GITHUB_REPOSITORY/branches/main/protection" \
              --jq '.required_status_checks.strict' 2>/dev/null || echo false; } )
          QUEUE=false
          RULESET=$( { ghp api "repos/$GITHUB_REPOSITORY/rulesets" --jq '.[].id' 2>/dev/null || true; } )
          for rs in $RULESET; do
            regles=$(ghp api "repos/$GITHUB_REPOSITORY/rulesets/$rs" 2>/dev/null || true)
            [ -n "$regles" ] || continue
            s_rs=$(printf '%s' "$regles" | jq -r '[.rules[]? | select(.type=="required_status_checks")
                      | .parameters.strict_required_status_checks_policy] | first // false' 2>/dev/null || echo false)
            q_rs=$(printf '%s' "$regles" | jq -r '[.rules[]? | select(.type=="merge_queue")] | length' 2>/dev/null || echo 0)
            [ "${s_rs:-false}" = "true" ] && STRICT=true
            [ "${q_rs:-0}" -gt 0 ] && QUEUE=true
          done
          if [ "${MERGIFY_QUEUE:-0}" = "1" ]; then QUEUE=true; fi
          echo "strict=$STRICT file_de_merge=$QUEUE"
          printf 'strict=%s\nqueue=%s\n' "$STRICT" "$QUEUE" >> "$GITHUB_OUTPUT"
          # Selection (v13): if there is a ready PR (CLEAN, not draft), include
          # everything except BEHIND — the coming merge moves `main`, so a
          # rebase would be lost. Otherwise prepare ONE `BEHIND` PR, the
          # oldest: rebasing all PRs on every `main` move means N restarted
          # CIs, none finishing before the next move.
          # Comments stay OUTSIDE the jq filter: an apostrophe in a
          # `--jq '…'` closes the single quote and gh dies on "unknown
          # arguments" (seen on 29/10: `discover` silently returned an empty
          # matrix and no PR was swept).
          FILTRE='[.[] | select(.headRepository.nameWithOwner == "GaiaSG94/revision")
            | {pr: .number, sha: .headRefOid, branch: .headRefName,
               state: .mergeStateStatus, draft: (.isDraft | tostring),
               main: .baseRefOid, maj: .updatedAt}]
            | (map(select(.state == "CLEAN" and .draft == "false"))) as $pretes
            | if ($pretes | length) > 0
              then map(select(.state != "BEHIND"))
              else map(select(.state != "BEHIND"))
                   + (map(select(.state == "BEHIND")) | sort_by(.maj) | .[0:1])
              end'
          # An unreadable list must be RED, not empty: an empty matrix
          # was read as "no PR to sweep" and the queue went silent.
          # ── REST inventory (v19) ───────────────────────────────────────
          # `gh pr list --json` queries GraphQL; the REST bucket is separate and
          # larger. One caveat: the list does not compute `mergeable_state`
          # (null until GitHub has computed it); the PR detail,
          # it does return it — hence one read per PR, ten at worst.
          # ── stabilization wait (v29, 10/11) ──────────────────────────────────
          # Creating the *run's own* check-runs on the PR head
          # restarts GitHub's `mergeable_state` calculation: the detail
          # flaps (clean/unstable/unknown) for ~2 min, and the one-shot
          # read always fell into it on repos without
          # cron or push (probe near_probe-autosetup, PR #6: 5 consecutive
          # UNSTABLE readings, proven transient by an external probe).
          # v29: we re-read up to 12 times at 10 s intervals while the state
          # is transient (the flapping window sometimes exceeds 45 s —
          # PR #12 probe: 4 consecutive UNSTABLE reads despite the wait);
          # beyond that, verdict as-is (the v21 retry takes over on the
          # next trigger).
          lire_fiche() { # $1=PR number → stabilised detail json
            local n="$1" i fiche etat
            for i in $(seq 1 12); do
              fiche="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" \
                2>/dev/null)" || return 1
              etat="$(printf '%s' "$fiche" | jq -r .mergeable_state \
                2>/dev/null || echo unknown)"
              case "$etat" in
                unknown|unstable)
                  echo "PR #$n: $etat (read $i/12), waiting" >&2
                  sleep 10 ;;
                *) printf '%s' "$fiche"; return 0 ;;
              esac
            done
            printf '%s' "$fiche"; return 0
          }
          inventaire() {
            local n
            gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
              --jq '.[].number' 2>/dev/null \
              | while read -r n; do
                  lire_fiche "$n" | jq '{
                    number: .number, headRefOid: .head.sha, headRefName: .head.ref,
                    mergeStateStatus: (if .draft then "DRAFT"
                      else ({"clean":"CLEAN","dirty":"DIRTY","blocked":"BLOCKED",
                             "unstable":"UNSTABLE","behind":"BEHIND"}[.mergeable_state] // "UNKNOWN")
                      end),
                    isDraft: .draft,
                    headRepository: {nameWithOwner: (.head.repo.full_name // "")},
                    baseRefOid: .base.sha, updatedAt: .updated_at }' 2>/dev/null
                done | jq -s .
          }
          if ! MATRIX=$(inventaire | jq -c "$FILTRE"); then
            echo "::error::PR list unreadable — queue paused (see log above)"
            exit 1
          fi
          # An empty inventory must be TRUE (no open PRs), not the
          # symptom of a failed read: we check before staying silent.
          if [ "$MATRIX" = "[]" ] && \
            [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=1" --jq 'length' 2>/dev/null || echo 1)" != "0" ]; then
            echo "::error::empty PR inventory while PRs are open — queue paused"
            exit 1
          fi
          [ -n "$MATRIX" ] || MATRIX="[]"
          # ── targeting v17 ─────────────────────────────────────────────────
          # A CI completion for PR X does not justify cloning the 10 other
          # open PRs: a matrix of 10 × 134 MB clones per trigger is what
          # drained the pool. So we keep only the head that spoke, plus the
          # oldest `BEHIND` (the only one v13 grants a rebase). The full
          # matrix remains for `push` on `main` and for the cron, which are
          # the two safety nets.
          # `unique_by(.pr)`: the targeted head may also be the `BEHIND`.
          # Unreadable `MATRIX` or unknown head → full matrix (never less
          # work than needed, never silence).
          if [ "${EVENT:-}" = "workflow_run" ] && [ -n "${HEAD_SHA:-}" ] && [ "$MATRIX" != "[]" ]; then
            # v26 (31/10) — targeting cannot be the only coverage:
            # GitHub keeps only ONE pending run per concurrency group, so a
            # targeted sweep may be cancelled by a neighbouring burst, and the
            # targeted head then has no event to wake it (seen on #652: CI
            # done, targeted run cancelled, nobody left). We therefore always
            # include PRs in an **actionable** state (DIRTY, BLOCKED, DRAFT):
            # few of them, no useless work (10 min window), and none can be
            # left orphaned.
            CIBLE=$(printf '%s' "$MATRIX" | jq -c --arg s "$HEAD_SHA" '
              [ .[] | select(.sha == $s) ]
              + [ .[] | select(.state == "DIRTY" or .state == "BLOCKED"
                               or .state == "DRAFT") ]
              + ([ .[] | select(.state == "BEHIND") ] | sort_by(.maj) | .[0:1])
              | unique_by(.pr)' 2>/dev/null || echo "")
            if [ -n "${CIBLE:-}" ]; then
              echo "targeted sweep on $HEAD_SHA: $(printf '%s' "$MATRIX" | jq 'length') PR → $(printf '%s' "$CIBLE" | jq 'length')"
              MATRIX="$CIBLE"
            fi
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq -r '.[] | "PR #\(.pr) \(.state) (updated \(.maj))"'

  sweep:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebase / resolve / merge PR ${{ matrix.pr }}
        env:
          # v18 — same split as in `discover`: `gh` reads with the installation
          # token (quota separate from the PAT, which all agents exhaust), and
          # writes only with the PAT (`ghe`), because
          # `github-actions[bot]` cannot command Mergify.
          GH_TOKEN: ${{ github.token }}
          GH_ECRITURE: ${{ secrets.AUTOMERGE_PAT }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_MODEL: ${{ vars.FIREWORKS_MODEL }}
          # [OI]-compatible upstream (InferHub here): without this variable,
          # the conflict agent falls back to the default URL and returns 404
          # with our key.
          FIREWORKS_BASE_URL: ${{ vars.FIREWORKS_BASE_URL }}
          FIREWORKS_AGENT_RESOLVE: ${{ vars.FIREWORKS_AGENT_RESOLVE }}
          FIREWORKS_AGENT_SCOPE: ${{ vars.FIREWORKS_AGENT_SCOPE }}
          # v22 — test repair agent (zeroclaw `fw`): `0` disables it.
          TEST_AGENT: ${{ vars.TEST_AGENT }}
          # v28 — `0` hands red-test repair back to the sweeper (otherwise the
          # `triage-rouge` workflow takes it, with the triage hint).
          TRIAGE_TEST: ${{ vars.TRIAGE_TEST }}
          REPO: GaiaSG94/revision
          PR: ${{ matrix.pr }}
          SHA: ${{ matrix.sha }}
          BRANCH: ${{ matrix.branch }}
          MASTER: ${{ matrix.main }}
          STATE: ${{ matrix.state }}
          DRAFT: ${{ matrix.draft }}
          STRICT: ${{ needs.discover.outputs.strict }}
          QUEUE: ${{ needs.discover.outputs.queue }}
        run: |
          # gh + jq: r630 in user space, Dell runners system-wide (127 seen 28/10 on revision-3)
          ghe() { GH_TOKEN="$GH_ECRITURE" gh "$@"; } # writes: PAT identity
          # ── REST reads (v19) ────────────────────────────────────────────
          # `gh pr checks` and `gh pr view --json` query GraphQL. The token
          # of the installation (v18) has its own quota, but REST has another
          # even larger, with the same data: we read it there. On
          # 31/10, GraphQL exhaustion alone made the sweeper blind for
          # a whole hour.
          tete() { # $1=pr → head sha (one read per job)
            if [ -z "${TETE_PR:-}" ]; then
              TETE_PR=$(gh api "repos/$REPO/pulls/$1" --jq .head.sha 2>/dev/null || echo "${SHA:-}")
            fi
            printf '%s' "$TETE_PR"
          }
          checks_pr() { # $1=pr → [{name,state,bucket,link}], same keys as `gh pr checks --json`
            # A context may have several runs (retry, cancellation): we keep
            # only the most recent per name, as GitHub does for a merge gate —
            # otherwise a cancelled `couche0` next to the green one counts
            # twice and the PR is never "green".
            # v27 — tie-break by **run** (suite), not `started_at`:
            # GitHub attaches a required check to the most recent suite, so a
            # `couche0` cancelled by an `edited` stays the verdict even if an
            # older attempt is green (#702). `started_at` now only breaks
            # ties between two attempts of the same run.
            gh api "repos/$REPO/commits/$(tete "$1")/check-runs?per_page=100" --jq '
              [ .check_runs[] | { name: .name, conclusion: .conclusion,
                                  link: .html_url, debut: .started_at,
                                  run: ((.html_url // ""
                                         | capture("/runs/(?<id>[0-9]+)")
                                         | .id | tonumber) // 0) } ]
              | sort_by(.name, .run, .debut)
              | group_by(.name) | map(.[-1])
              | map({ name: .name,
                      state: ((.conclusion // "pending") | ascii_upcase),
                      bucket: (if .conclusion == null then "pending"
                               elif (.conclusion == "success" or .conclusion == "neutral") then "pass"
                               elif .conclusion == "skipped" then "skipping"
                               elif .conclusion == "cancelled" then "cancel"
                               else "fail" end),
                      link: .link })' 2>/dev/null
          }
          commentaires() { # $1=pr → one comment body per line
            gh api "repos/$REPO/issues/$1/comments?per_page=100" --jq '.[].body' 2>/dev/null
          }
          green() { # 0 if the 3 required checks of PR $1 are SUCCESS
            checks_pr "$1" | jq -e '
              ["ci","ci-budget","couche0"] as $req |
              [ .[] | select(.name as $n | $req | index($n)) ] as $got |
              ($got | length == 3) and
              ([$got[] | select(.state == "SUCCESS")] | length == 3)
            ' >/dev/null
          }
          # ── state of a blocked PR ──────────────────────────────────────────
          # `BLOCKED` was the v9 hole: the `case` did not handle it,
          # so the PR stayed blocked forever (real case: #215).
          echecs_requis() { # names of failed required checks, space-separated
            checks_pr "$1" \
              | jq -r '[.[] | select(.bucket=="fail")
                        | .name | select(.=="ci" or .=="ci-budget" or .=="couche0")]
                       | join(" ")' || true
          }
          annules_requis() { # names of cancelled required checks (no verdict), space-separated
            checks_pr "$1" \
              | jq -r '[.[] | select(.bucket=="cancel")
                        | .name | select(.=="ci" or .=="ci-budget" or .=="couche0")]
                       | join(" ")' || true
          }
          marques() { # $1=pr $2=marker → number of comments carrying the marker
            commentaires "$1" | grep -cF -- "$2" || true
          }
          commente_une_fois() { # $1=pr $2=marker $3=body (the body carries the marker)
            [ "$(marques "$1" "$2")" -gt 0 ] && return 0
            ghe pr comment "$1" --body "$3" >/dev/null 2>&1 || true
            return 0
          }
          commits_de_fusion() { # number of merge commits in a PR (at most 100 commits read)
            gh api "repos/$REPO/pulls/$1/commits?per_page=100" \
              --jq '[.[] | select((.parents | length) > 1)] | length' 2>/dev/null || echo 0
          }
          refus_de_rebase() { # 0 if the queue ejected the PR because it could not rebase it
            # The queue merges in `rebase` mode; when a commit does not replay on
            # `main` (file deleted on one side, modified on the other), GitHub
            # answers "Pull request must be rebased manually" and the PR leaves.
            # A **linear** branch can therefore be refused: counting the
            # merge commits alone is not enough, we must read the verdict.
            gh api "repos/$REPO/issues/$1/comments?per_page=100" \
              --jq '[.[] | select(.body | contains("Mergify Payload"))] | last | .body // ""' \
              2>/dev/null | grep -q 'GITHUB_REBASE_MERGE_REFUSED'
          }
          commits_non_attribues() { # number of commits whose author is not linked to any account
            gh api "repos/$REPO/pulls/$1/commits?per_page=100" \
              --jq '[.[] | select(.author == null)] | length' 2>/dev/null || echo 0
          }
          etapes_cassees() { # $1=run id → failed steps (empty = lost job)
            gh run view "$1" --json jobs --jq '
              [.jobs[] | select(.conclusion=="failure")
               | .steps[] | select(.conclusion=="failure") | .name] | join(" | ")' \
              2>/dev/null || true
          }
          # ── sweep fingerprint ────────────────────────────────────────────
          # Triggers arrive in bursts (`CI` end, `couche0` end, cron) and
          # redid the same clone + same rebase for nothing: a pair
          # (head, base, state, check fingerprint) is swept only once.
          # swept only once.
          # The check fingerprint is necessary: a PR is BLOCKED when
          # CI is running *and* when it has failed, yet that is exactly
          # when a retry is needed. The signature (name=state, sorted)
          # distinguishes the two, and a new verdict changes the key.
          # Unreadable signature → "indeterminate" → never deduplicated.
          sig="$( { checks_pr "$PR" || true; } \
            | jq -er '[.[] | "\(.name)=\(.state)"] | sort | join(",")' 2>/dev/null || true )"
          PF="indetermine"
          if [ -n "${sig:-}" ]; then
            PF="$(printf '%s' "$sig" | sha1sum | cut -c1-10)"
          fi
          echo "checks fingerprint: $PF"
          ETAT_MARQUE="<!-- automerge-etat -->"
          deja_balayee() {
            [ "$PF" = "indetermine" ] && return 1
            gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '[.[] | select(.body | startswith("<!-- automerge-etat -->"))]
                    | last | .body // ""' 2>/dev/null \
              | grep -qF "sha=$SHA main=$MASTER state=$STATE pf=$PF"
          }
          noter_etat() { # $1 = what was done (one line)
            local cid corps
            cid=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '[.[] | select(.body | startswith("<!-- automerge-etat -->"))]
                    | last | .id // ""' 2>/dev/null || true)
            corps=$(printf '%s\nsha=%s main=%s state=%s pf=%s ts=%s\n\n%s' \
              "$ETAT_MARQUE" "$SHA" "$MASTER" "$STATE" "$PF" \
              "$(date -u +%s)" "$1")
            if [ -n "${cid:-}" ] && [ "$cid" != "null" ]; then
              ghe api -X PATCH "repos/$REPO/issues/comments/$cid" \
                -f body="$corps" >/dev/null 2>&1 || true
            else
              ghe pr comment "$PR" --body "$corps" >/dev/null 2>&1 || true
            fi
          }
          age_etat_minutes() { # minutes since last state note (999 if none)
            local quand secs
            quand=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '[.[] | select(.body | startswith("<!-- automerge-etat -->"))]
                    | last | .updated_at // ""' 2>/dev/null || true)
            [ -n "${quand:-}" ] || { echo 999; return 0; }
            secs=$(( $(date -u +%s) - $(date -u -d "$quand" +%s) )) || secs=0
            [ "$secs" -ge 0 ] || secs=0
            echo $(( secs / 60 ))
          }
          # ── merge without rebase ────────────────────────────────────────
          # A `BEHIND` PR can be merged as-is: `strict` is
          # `false` in protection, and `merge --rebase` rebases server-side.
          # Only do this if no file overlaps what `main` took
          # from the PR base: where a rebase cannot change the content,
          # it only restarts CI (60-90 s per PR).
          recouvrement_fichiers() { # 0 = overlap (or doubt) → rebase
            local pr_files master_files n
            pr_files=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate \
              --jq '.[].filename' 2>/dev/null | sort -u || true)
            master_files=$(gh api "repos/$REPO/compare/$MASTER...main" \
              --jq '.files[].filename' 2>/dev/null | sort -u || true)
            # Empty or truncated list (API caps at 300 files): doubt.
            [ -n "$pr_files" ] && [ -n "$master_files" ] || return 0
            n=$(printf '%s\n' "$master_files" | wc -l)
            [ "$n" -ge 300 ] && return 0
            comm -12 <(printf '%s\n' "$pr_files") \
                      <(printf '%s\n' "$master_files") | grep -q . && return 0
            return 1
          }
          ECHELLE_ETAPES=""
          # v27 — a retry must never land while a suite of the
          # same workflow starts on the same head: the workflow's
          # `concurrency` then cancels the fresh suite, and its `cancelled` —
          # a newer run than the green one — becomes the verdict read by GitHub
          # and Mergify. Result: PR blocked forever, without a single red
          # (#702, 31/10). We let the in-progress suite render its verdict.
          suite_en_cours() { # $1=workflow id $2=sha → 0 if a suite is already running
            local wf="${1:-}" sha="${2:-}" n
            [ -n "$wf" ] && [ -n "$sha" ] || return 1
            [ "$wf" != "0" ] || return 1
            n=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100" \
                  --jq --argjson wf "$wf" '
                    [ .workflow_runs[]
                      | select(.workflow_id == $wf)
                      | select(.status == "queued" or .status == "in_progress"
                               or .status == "waiting" or .status == "requested"
                               or .status == "pending") ] | length' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ]
          }
          runs_requis_en_echec() { # $1=pr → ids of failed ci/ci-budget runs
            checks_pr "$1" \
              | jq -r '[.[] | select(.bucket=="fail")
                         | select(.name=="ci" or .name=="ci-budget") | .link][]
                       | select(. != null)' \
              | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p' | sort -u
          }
          est_infra() { # $1=broken steps → 0 if infrastructure failure
            # v28 — "scope" is NOT infra: the step "CI guard tests
            # (conflicts, scope, couche0, budget)" is a TEST step
            # (seen #896: KeyError classified as infra, 2 retries burned,
            # fw agent never called). Infra = setup, checkout, caches, post.
            [ -z "$1" ] || printf '%s' "$1" |
              grep -qE 'Set up job|heckout|Setup Gradle|Post |Fetch|cache|toolchain'
          }
          echec_reel() { # $1=pr → 0 if a required run carries a real failure
            local pr="$1" runs run sha_run wf_run etapes
            runs=$(runs_requis_en_echec "$pr")
            [ -n "$runs" ] || return 1
            for run in $runs; do
              read -r sha_run wf_run <<<"$(gh run view "$run" \
                --json headSha,workflowDatabaseId \
                --jq '"\(.headSha) \(.workflowDatabaseId)"' 2>/dev/null || true)" || true
              [ "$sha_run" = "$SHA" ] || continue
              suite_en_cours "$wf_run" "$sha_run" && continue
              etapes=$(etapes_cassees "$run")
              if ! est_infra "$etapes"; then
                ECHELLE_ETAPES="$etapes"
                return 0
              fi
            done
            return 1
          }
          relancer() { # $1=pr; 0 = retried, 1 = real failure, 2 = nothing to retry
            local pr="$1" runs run sha_run wf_run etapes rc=2
            runs=$(runs_requis_en_echec "$pr")
            [ -n "$runs" ] || return 2
            for run in $runs; do
              # Never retry a run from another commit: that would not change
              # this PR's checks, it would just burn a runner.
              read -r sha_run wf_run <<<"$(gh run view "$run" \
                --json headSha,workflowDatabaseId \
                --jq '"\(.headSha) \(.workflowDatabaseId)"' 2>/dev/null || true)" || true
              if [ "$sha_run" != "$SHA" ]; then
                echo "  run $run: other commit, no retry"
                continue
              fi
              if suite_en_cours "$wf_run" "$sha_run"; then
                echo "  run $run: suite of same workflow already running on ${sha_run:0:7}, retry skipped"
                continue
              fi
              etapes=$(etapes_cassees "$run")
              # Infrastructure failure (lost runner, checkout, cache): retrying
              # is the right move. Red test: retrying proves nothing and burns
              # the 5 min per-job budget — we say so, once per head.
              if est_infra "$etapes"; then
                if ghe run rerun "$run" --failed >/dev/null 2>&1; then
                  echo "  run $run retried (infrastructure failure)"
                  rc=0
                else
                  echo "  run $run: retry refused"
                fi
              else
                echo "  run $run: real failure in "$etapes", no retry"
                ECHELLE_ETAPES="$etapes"
                rc=1
              fi
            done
            return $rc
          }
          relancer_annules() { # $1=pr; 0 = retried, 1 = nothing to retry
            local pr="$1" runs run sha_run wf_run rc=1
            runs=$(checks_pr "$pr" \
              | jq -r '[.[] | select(.bucket=="cancel")
                         | select(.name=="ci" or .name=="ci-budget" or .name=="couche0") | .link][]
                       | select(. != null)' \
              | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p' | sort -u)
            [ -n "$runs" ] || return 1
            for run in $runs; do
              # Same guard as relancer(): never retry a run
              # from another commit (replaced, it would change nothing here).
              read -r sha_run wf_run <<<"$(gh run view "$run" \
                --json headSha,workflowDatabaseId \
                --jq '"\(.headSha) \(.workflowDatabaseId)"' 2>/dev/null || true)" || true
              if [ "$sha_run" != "$SHA" ]; then
                echo "  run $run: other commit, no retry"
                continue
              fi
              if suite_en_cours "$wf_run" "$sha_run"; then
                echo "  run $run: suite of same workflow already running on ${sha_run:0:7}, retry skipped"
                continue
              fi
              # FULL replay: a cancelled job is not a failed job,
              # `--failed` would retry nothing.
              if ghe run rerun "$run" >/dev/null 2>&1; then
                echo "  run $run retried (cancelled run)"
                rc=0
              else
                echo "  run $run: retry refused"
              fi
            done
            return $rc
          }
          relancer_couche0() { # $1=pr; 0 = retried, 1 = nothing to retry
            # v27 (31/10) — stale verdict: scope was completed but
            # `couche0` did not replay (lost `edited` event). The guard
            # re-reads the current body via the API, so retrying its failed run
            # suffices — same SHA, fresh verdict. Same guards as relancer():
            # never retry a run from another commit.
            local pr="$1" runs run sha_run wf_run rc=1
            runs=$(checks_pr "$pr" \
              | jq -r '[.[] | select(.bucket=="fail")
                         | select(.name=="couche0") | .link][]
                       | select(. != null)' \
              | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p' | sort -u)
            [ -n "$runs" ] || return 1
            for run in $runs; do
              read -r sha_run wf_run <<<"$(gh run view "$run" \
                --json headSha,workflowDatabaseId \
                --jq '"\(.headSha) \(.workflowDatabaseId)"' 2>/dev/null || true)" || true
              if [ "$sha_run" != "$SHA" ]; then
                echo "  run $run: other commit, no retry"
                continue
              fi
              if suite_en_cours "$wf_run" "$sha_run"; then
                echo "  run $run: suite of same workflow already running on ${sha_run:0:7}, retry skipped"
                continue
              fi
              if ghe run rerun "$run" --failed >/dev/null 2>&1; then
                echo "  run $run retried (stale couche0 after scope fix)"
                rc=0
              else
                echo "  run $run: retry refused"
              fi
            done
            return $rc
          }
          commenter_echec() { # $1=pr: reports the real failure, calls fw (1/head)
            local pr="$1" rc2 corps motif
            printf -v corps '%s\n' \
              "<!-- automerge-echec sha=$SHA -->" \
              "**Real** CI failure (step "${ECHELLE_ETAPES}"): the queue does not retry a red test, that would prove nothing. A fix is needed, not a re-run."
            # v20 (31/10) — is this failure ours? If the current
            # head was pushed by the conflict agent, it is
            # its resolution that must be re-read before the author's
            # code (#615: uncompilable reconciliation,
            # classified "real failure", PR abandoned silently
            # until a human stepped in). The agent's compilation
            # gate is supposed to make this case impossible: if we see
            # it here, the gate was skipped (tooling absent, timeout) —
            # we say so and set the label, rather than letting the PR
            # die silently.
            if commentaires "$pr" | grep -qF "<!-- agent-conflit sha=$SHA -->"; then
              # printf rather than a multi-line string: an unindented
              # line would cut the `run: |` block.
              printf -v motif '%s\n%s' "$corps" \
                "Head `${SHA:0:7}` came from **the conflict agent**: it is the resolution that fails, not the author's code. Label `intervention-humaine` set — re-read the reconciliation (or rebase manually) before retrying."
              corps="$motif"
              ghe pr edit "$pr" --add-label intervention-humaine >/dev/null 2>&1 || true
              echo "PR #$pr: failure on a conflict-agent head, intervention-humaine label"
            fi
            # v22 (31/10) — a REAL failure triggers the agent to
            # test zeroclaw `fw` (user order): it reads the log
            # of the failed run(s), fixes in the clone, and the
            # driver (test_agent.py) refuses to push anything that
            # touches a guard file, exceeds 20 files or
            # 1,500 lines, or does not compile. One attempt
            # per head (marker): never an agent loop.
            # v28 (01/11) — red-test repair belongs to the
            # `triage-rouge` workflow once armed (`TRIAGE_TEST` ≠ 0):
            # it reruns the failed class ALONE, infers the order
            # dependency and names suspect tests, then calls this same
            # driver **with that hint**. Seen on #919: without a hint, two
            # 150 s invocations returned "budget exceeded" and the PR waited
            # half an hour for one line to add. `TRIAGE_TEST=0` hands the
            # main back to the sweeper, without changing anything else.
            if [ "$(marques "$pr" "<!-- test-agent sha=$SHA -->")" -eq 0 ] \
               && [ "${TEST_AGENT:-1}" != "0" ] \
               && [ "${TRIAGE_TEST:-1}" = "0" ]; then
              rc2=0
              git show origin/main:.github/fireworks/test_agent.py \
                > /tmp/fw-test-agent.py 2>/dev/null \
                && python3 /tmp/fw-test-agent.py fix --repo "$REPO" \
                     --pr "$pr" --branch "$BRANCH" --sha "$SHA" || rc2=$?
              case "$rc2" in
                0) printf -v corps '%s\n%s' "$corps" \
                     "Agent `fw` fix pushed (compilation checked): CI re-judges." ;
                 2) echo "PR #$pr: test agent with no proposal (see its comment)" ;;
                # v25 (31/10) — unprovisioned runner: this is
                # not an agent failure, and it set no marker.
                # We say so without promising anything; the head
                # keeps its attempt for the next pass (#652:
                # binary installed 2 min after the only attempt).
                3) echo "PR #$pr: agent tooling absent on runner — no attempt consumed, retry next pass" ;
                *) printf -v corps '%s\n%s' "$corps" \
                     "The \`fw\` agent could not fix it (see its comment) — human intervention." ;;
              esac
            fi
            commente_une_fois "$pr" "<!-- automerge-echec sha=$SHA -->" "$corps"
          }
          # ── lazy clone ──────────────────────────────────────────────────────
          # The clone is only used by paths that write to a branch:
          # rebase (BEHIND, DIRTY), linearisation before the queue, scope
          # agent. It is therefore **lazy**: a green PR entering the
          # queue does not pay its cost.
          # Git auth: PAT in the URL (x-access-token), passed by command —
          # nothing is persisted in the runner's git config. The gh helper
          # ('!gh auth git-credential') returns 403 on runners (seen 28/10).
          AUTH_URL="https://x-access-token:${GH_ECRITURE}@github.com/${REPO}.git"
          CLONE_FAIT=""
          preparer_clone() { # 0 = repo ready, 1 = clone impossible
            [ -n "$CLONE_FAIT" ] && return 0
            rm -rf repo
            git clone --quiet --filter=blob:none "$AUTH_URL" repo || return 1
            cd repo || return 1
            # Additive log: `union` keeps both entries instead of raising
            # a conflict. Set in `info/attributes` and not only in
            # `.gitattributes`: an old branch does not yet carry the
            # file, and that is precisely the one that conflicts. Without it, every
            # `main` move restarted the Fireworks agent on CHANGELOG.md
            # → a push → a CI → a `main` move (livelock, 29/10).
            printf 'CHANGELOG.md merge=union\n' >> .git/info/attributes
            # Owner identity (repo rule): a commit pushed by
            # the sweeper must be attributable, never anonymous.
            git config user.name "GaiaSG94"
            git config user.email "290536685+GaiaSG94@users.noreply.github.com"
            export GIT_EDITOR=true
            CLONE_FAIT=1
          }
          rebaser() { # rebase the PR onto main; the Fireworks agent resolves conflicts
              if git fetch -q "$AUTH_URL" "pull/$PR/head:pr-$PR" 2>/dev/null \
                && git checkout -q "pr-$PR" 2>/dev/null \
                && git rebase -q origin/main >/dev/null 2>&1; then
                if git push -q --force-with-lease="$BRANCH:$SHA" "$AUTH_URL" "HEAD:$BRANCH" 2>&1; then
                  echo "PR #$PR rebased onto main"
                else
                  echo "PR #$PR: moved in the meantime, next pass"
                fi
              else
                # Rebase in conflict: the agent reads the script from main (the
                # branch may be older), resolves, finishes
                # the rebase and pushes itself. 0 = pushed, 1 = failure with
                # report, 2 = nothing to do: skip silently.
                rc=0 # "|| rc=$?": the step runs under bash -e, without this
                # a non-zero exit from the agent would kill the whole sweep.
                # The PAT in `GH_TOKEN`: the agent's push must carry
                # the owner's identity, otherwise the commit arrives via
                # `@github-actions[bot]` and the workflows start in
                # `action_required` (no required check, PR `BLOCKED` — seen on
                # #634 on 31/10). `auto-approve.yml` remains the safety net.
                git show origin/main:.github/fireworks/conflict_agent.py \
                  > /tmp/fw-agent.py 2>/dev/null \
                  && GH_TOKEN="$GH_ECRITURE" python3 /tmp/fw-agent.py resolve --repo "$REPO" \
                    --pr "$PR" --branch "$BRANCH" --sha "$SHA" || rc=$?
                git rebase --abort >/dev/null 2>&1 || true
                git checkout -q main 2>/dev/null || true
                case "$rc" in
                  0) echo "PR #$PR: conflict resolved by the Fireworks agent" ;
                  *) echo "PR #$PR skipped (conflict, author must rebase)" ;
                esac
              fi
          }
          # Re-attribution: a commit whose author is not linked to any account
          # GitHub ("*@local" for agents: freebuff-exec, muse-integration, …)
          # triggers `require_extra_approval_for_unattributed_changes` of the
          # ruleset — an extra approval nobody can
          # give when the repo owner is themselves the author of the
          # PR. Result: all checks green, PR `BLOCKED` forever
          # (seen on 31/10 on #576 and #525). We rewrite the author onto the
          # PR author's noreply address: the commit remains theirs, it becomes
          # attributable.
          reattribuer() { # 0 = re-attributed and pushed, 1 = failure
            local login id noreply
            login=$(gh api "repos/$REPO/pulls/$PR" --jq .user.login 2>/dev/null || echo "")
            id=$(gh api "users/$login" --jq .id 2>/dev/null || echo "")
            [ -n "$login" ] && [ -n "$id" ] || return 1
            noreply="$id+$login@users.noreply.github.com"
            git fetch -q "$AUTH_URL" "pull/$PR/head:pr-$PR" 2>/dev/null || return 1
            git checkout -q "pr-$PR" 2>/dev/null || return 1
            FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter "
              case \"\$GIT_AUTHOR_EMAIL\" in
                *@local) export GIT_AUTHOR_NAME=\"$login\"; export GIT_AUTHOR_EMAIL=\"$noreply\" ;;
              esac" origin/main..HEAD >/dev/null 2>&1 || return 1
            git push -q --force-with-lease="$BRANCH:$SHA" "$AUTH_URL" "HEAD:$BRANCH" 2>&1 || return 1
          }
          # ── merge queue (Mergify) ────────────────────────────────────────
          # When a queue is active, the sweeper no longer merges or rebases
          # more: the queue enqueues, updates the PR against
          # `main` and replays checks on the batch's merged tree.
          # The sweeper keeps what the queue cannot do: resolve a
          # conflict (DIRTY) and retry an infrastructure outage (BLOCKED).
          if [ "${QUEUE:-false}" = "true" ]; then
            case "$STATE" in
              CLEAN|BEHIND)
                # The queue updates the PR against `main` and tests the
                # merged batch tree: no rebase or merge here. It remains to
                # enter: `merge_protections_settings.auto_merge_conditions`
                # depends on a second Mergify product; the command itself
                # depends on nothing (verified on 29/10: "product to activate" →
                # "waiting for queue conditions" after activation).
                #
                # Linearity first: the queue merges with `rebase`, and GitHub
                # refuses the rebase-merge of a branch that carries merge
                # commits ("Pull request must be rebased manually",
                # (GITHUB_REBASE_MERGE_REFUSED). A branch that has *merged*
                # `main` instead of rebasing it is not `BEHIND` — its base
                # is an ancestor — so nothing flagged it: the queue
                # accepted it, rejected it at merge, the sweep put it back.
                # Endless loop (3 ejections of PR #525 on 31/10, ~2 min
                # of CI burned each round). We linearise before the queue.
                FUSIONS="$(commits_de_fusion "$PR")"
                case "$FUSIONS" in ''|*[!0-9]*) FUSIONS=0 ;; esac
                # Same treatment for a linear branch the queue just
                # ejected because GitHub could not rebase it: the
                # refusal is the symptom, local rebase the remedy.
                REFUS=false
                if [ "$FUSIONS" -eq 0 ] && refus_de_rebase "$PR"; then REFUS=true; fi
                if [ "$DRAFT" != "true" ] && { [ "$FUSIONS" -gt 0 ] || [ "$REFUS" = true ]; } \
                  && [ "$(marques "$PR" "<!-- automerge-linearise sha=$SHA -->")" -eq 0 ]; then
                  if ! preparer_clone; then
                    echo "PR #$PR: linearisation needed, clone impossible — no enqueue"
                    exit 0
                  fi
                  printf -v corps '%s\n' \
                    "<!-- automerge-linearise sha=$SHA -->" \
                    "Branch not mergeable as-is ($FUSIONS merge commit(s), queue refused: $REFUS): rebased onto `main` and pushed, CI restarted."
                  gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$corps" >/dev/null 2>&1 || true
                  echo "PR #$PR: linearisation before queue (merges=$FUSIONS refused=$REFUS)"
                  rebaser
                  exit 0
                fi
                # Attribution next: an unlinked author commit makes the
                # PR permanently `BLOCKED` despite green checks (rule
                # `require_extra_approval_for_unattributed_changes`). On
                # re-attributes once per head, then CI replays.
                NON_ATTRIBUES="$(commits_non_attribues "$PR")"
                case "$NON_ATTRIBUES" in ''|*[!0-9]*) NON_ATTRIBUES=0 ;; esac
                if [ "$DRAFT" != "true" ] && [ "$NON_ATTRIBUES" -gt 0 ] \
                  && [ "$(marques "$PR" "<!-- automerge-attribution sha=$SHA -->")" -eq 0 ]; then
                  if preparer_clone && reattribuer; then
                    printf -v corps '%s\n' \
                      "<!-- automerge-attribution sha=$SHA -->" \
                      "$NON_ATTRIBUES commit(s) whose author was not linked to any GitHub account: re-attributed to the PR author (`$SHA`), CI restarted. Without this, rule `require_extra_approval_for_unattributed_changes` left the PR `BLOCKED` with all checks green."
                    ghe pr comment "$PR" --body "$corps" >/dev/null 2>&1 || true
                    echo "PR #$PR: $NON_ATTRIBUES commit(s) re-attributed, CI restarted"
                  else
                    echo "PR #$PR: $NON_ATTRIBUES unattributed commit(s), re-attribution impossible"
                  fi
                  exit 0
                fi
                if [ "$DRAFT" != "true" ] && green "$PR" && ! deja_balayee; then
                  if ghe pr comment "$PR" --body "@mergifyio queue" >/dev/null 2>&1; then
                    echo "PR #$PR: enqueue requested"
                    noter_etat "enqueue requested (`@mergifyio queue`): the batch is tested on the merged tree."
                  else
                    echo "PR #$PR: queue command refused"
                  fi
                else
                  echo "PR #$PR: $STATE — merge queue, nothing to do here"
                fi
                exit 0
                ;;
            esac
          fi
          # v21 (31/10) — v11 dedup must not freeze a state that
          # *awaits action*. Seen: a `DIRTY` PR whose conflict agent
          # failed once (quota, model, compilation gate) keeps the same
          # pair (head, base, state, check fingerprint) — so the sweep
          # believed it "already done" every pass and NEVER picked it
          # up again (#634 on 31/10, and #615 before a human intervened). Same
          # for `BLOCKED`, whose retries are bounded by marker:
          # without this window, a PR whose gate refused the push stayed
          # dead until a `main` move.
          # We therefore resume `DIRTY` and `BLOCKED` at most every 10 min per
          # PR: enough to avoid cloning 134 MB on every sweep wake-up,
          # short enough that a PR does not rot for half a day.
          # v29: `UNSTABLE` joins the retry — the one-shot read falls
          # into the flapping window opened by the run's own check-runs
          # (near_probe-autosetup probe, PR #6); without retry, a
          # first transient verdict froze the PR until further notice.
          if deja_balayee; then
            case "$STATE" in
              DIRTY|BLOCKED|DRAFT|UNSTABLE)
                age="$(age_etat_minutes)"
                if [ "${age:-999}" -lt 10 ]; then
                  echo "PR #$PR: $STATE, last attempt ${age} min ago (< 10), waiting"
                  exit 0
                fi
                echo "PR #$PR: $STATE for ${age} min — new attempt"
                ;;
              *)
                echo "PR #$PR: swept for ${SHA:0:7} on ${MASTER:0:7} in state $STATE (nothing new)"
                exit 0
                ;;
            esac
          fi
          # ── fast path: behind the base, green, disjoint files ──────────────
          # No clone: this case is what drives throughput. Each merge moves
          # `main`, so *all* other PRs become `BEHIND`; rebasing
          # them one by one restarted their CI and moved `main`
          # (O(N²)). Here we merge, period.
          if [ "${STRICT:-true}" != "true" ] && [ "$STATE" = "BEHIND" ] \
            && [ "$DRAFT" != "true" ] && green "$PR" && ! recouvrement_fichiers; then
            if err=$(ghe pr merge --rebase --match-head-commit "$SHA" "$PR" 2>&1); then
              echo "PR #$PR merged without rebase (base behind, disjoint files)"
              noter_etat "merged without rebase: base behind, disjoint files, needless CI restart avoided."
              exit 0
            fi
            echo "PR #$PR: direct merge refused ($(printf '%s' "$err" | tail -1 | cut -c1-160)), rebasing"
          fi
          preparer_clone || { echo "clone impossible, nothing to do"; exit 0; }
          case "$STATE" in
            DIRTY) rebaser ;;
            # `BEHIND`: the fast path already said no (files that
            # overlap, draft, or checks not green) → classic rebase.
            BEHIND) rebaser ;;
            CLEAN)
              if [ "$DRAFT" = "true" ]; then
                echo "PR #$PR: up-to-date draft, no merge"
              elif green "$PR"; then
                if ghe pr merge --rebase --match-head-commit "$SHA" "$PR" >/dev/null 2>&1; then
                  echo "PR #$PR merged"
                else
                  echo "PR #$PR: merge refused (base moved?), next pass"
                fi
              else
                echo "PR #$PR: CI not green yet"
              fi
              ;;
            BLOCKED|DRAFT)
              # v23 (31/10) — a draft is never merged, but it is
              # **maintains**: v6 already rebased it, but the `DRAFT` state was
              # handled nowhere in this machine, so a draft with red
              # tests triggered nothing (seen on #652: the test agent
              # was never called). Same path as `BLOCKED`: bounded
              # retry of cancelled runs, scope agent, test agent.
              # v15 hole (real case: #434): a CANCELLED run (runner lost,
              # manual cancellation) has no verdict — `cancel` bucket,
              # not `fail` — so `echecs_requis` missed it and the PR
              # stayed blocked forever. A cancelled run is replayed, not
              # judged: no scope agent here, even if it is
              # `couche0` that was cancelled.
              annules="$(annules_requis "$PR")"
              if [ -n "${annules:-}" ]; then
                n="$(marques "$PR" "<!-- automerge-recancel sha=$SHA -->")"
                n="${n:-0}"
                if [ "$n" -lt 2 ]; then
                  if relancer_annules "$PR"; then
                    printf -v corps '%s\n' \
                      "<!-- automerge-recancel sha=$SHA -->" \
                      "Automatic retry ($((n + 1))/2) of the cancelled run on `${SHA:0:7}` — no verdict to judge, we replay the whole run."
                    ghe pr comment "$PR" --body "$corps" >/dev/null 2>&1 || true
                  else
                    echo "PR #$PR: cancelled run from another commit, no retry"
                  fi
                else
                  echo "PR #$PR: 2 cancellation retries already done for this SHA, stopping here"
                fi
              fi
              echecs="$(echecs_requis "$PR")"
              if [ -z "${echecs:-}" ]; then
                echo "PR #$PR: BLOCKED with no failed required check (review requested?), nothing to do"
              else
                echo "PR #$PR: BLOCKED — failed required check(s): $echecs"
                case " $echecs " in
                  *" couche0 "*)
                    # Scope: one attempt per PR head.
                    if [ "$(marques "$PR" "<!-- automerge-scope sha=$SHA -->")" -eq 0 ]; then
                      rc=0
                      # The PAT in `GH_TOKEN` (v27): the body edit must
                      # carry the owner identity, otherwise GitHub emits no
                      # `pull_request edited` event and `couche0` never re-judges
                      # (same cause as the conflict agent in v21 — seen on
                      # #688: fix written, no run behind, PR BLOCKED on a
                      # stale verdict).
                      git show origin/main:.github/fireworks/scope_agent.py \
                        > /tmp/fw-scope.py 2>/dev/null \
                        && git show origin/main:.github/couche0/check_couche0.py \
                          > /tmp/couche0.py 2>/dev/null \
                        && GH_TOKEN="$GH_ECRITURE" python3 /tmp/fw-scope.py fix --repo "$REPO" --pr "$PR" \
                          --sha "$SHA" --guard /tmp/couche0.py || rc=$?
                      case "$rc" in
                        0) echo "PR #$PR: scope completed, couche0 will re-judge" ;
                        2) echo "PR #$PR: scope left as-is (nothing fixable or already tried)" ;
                        *) echo "PR #$PR: scope not completed (code $rc)" ;
                      esac
                    else
                      echo "PR #$PR: scope already handled for this SHA, no loop"
                      # v27 — stale-verdict net: the fix is written (scope
                      # marker set) but `couche0` is still failing on
                      # this head, so its run did not replay. One retry,
                      # once per head: the guard re-reads the current body.
                      if [ "$(marques "$PR" "<!-- automerge-scope-rerun sha=$SHA -->")" -eq 0 ]; then
                        if relancer_couche0 "$PR"; then
                          printf -v corps '%s\n' \
                            "<!-- automerge-scope-rerun sha=$SHA -->" \
                            "Run `couche0` retried on `${SHA:0:7}`: scope had been completed but the verdict had not replayed (lost event). The guard re-reads the current body, no new commit."
                          ghe pr comment "$PR" --body "$corps" >/dev/null 2>&1 || true
                        fi
                      fi
                    fi
                    ;;
                esac
                case " $echecs " in
                  *" ci "*|*" ci-budget "*)
                    n="$(marques "$PR" "<!-- automerge-retry sha=$SHA -->")"
                    n="${n:-0}"
                    if [ "$n" -lt 2 ]; then
                      rc=0
                      relancer "$PR" || rc=$?
                      case "$rc" in
                        0)
                          printf -v corps '%s\n' \
                            "<!-- automerge-retry sha=$SHA -->" \
                            "Automatic retry ($((n + 1))/2) of failed required checks on `${SHA:0:7}` — jobs restarted, no new commit."
                          ghe pr comment "$PR" --body "$corps" >/dev/null 2>&1 || true
                          ;;
                        1)
                          commenter_echec "$PR"
                          ;;
                        *)
                          echo "PR #$PR: nothing to retry (run from another commit?)"
                          ;;
                      esac
                    # v28 — retries exhausted is not "repaired": if the failure
                    # is REAL, the fw agent keeps its one attempt per head
                    # (own marker, no loop). Seen #896: step "CI guard
                    # tests (conflicts, scope, …)" wrongly classed infra,
                    # 2 retries burned, then "stopping here" without
                    # ever calling the agent.
                    elif echec_reel "$PR"; then
                      commenter_echec "$PR"
                    else
                      echo "PR #$PR: 2 retries already done for this SHA, stopping here"
                    fi
                    ;;
                esac
              fi
              ;;
            UNKNOWN)
              # GitHub often recomputes within seconds: bounded poll.
              st="$STATE"
              for _ in 1 2; do
                sleep 5
                st="$(gh api "repos/$REPO/pulls/$PR" --jq '(if .draft then "DRAFT" else ({"clean":"CLEAN","dirty":"DIRTY","blocked":"BLOCKED","unstable":"UNSTABLE","behind":"BEHIND"}[.mergeable_state] // "UNKNOWN") end)' 2>/dev/null || echo UNKNOWN)"
                if [ "${st:-UNKNOWN}" != "UNKNOWN" ]; then break; fi
              done
              echo "PR #$PR: state $st after polling, next pass"
              ;;
            *) echo "PR #$PR: state $STATE, nothing to do" ;
          esac
          noter_etat "state `$STATE` · head `${SHA:0:7}` · base `${MASTER:0:7}` — swept, next pass on next change." 
