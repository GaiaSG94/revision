name: CI

# CI for Rature: strict typecheck, tests (domain, corpus, proxy quota),
# production build and quality guards (file/function sizes, layer checks).
# Verdict in a few tens of seconds on a self-hosted r630 runner; hard 5 min
# budget (user rule 2026-10-24).
#
# The published check is called `ci` (job name): required by `main`'s ruleset
# and the Mergify queue, along with `ci-budget` and `couche0`.
on:
  pull_request:
  # Merge queue: same check on the group’s temporary commit.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Persistent self-hosted runners: a stray subfolder from a previous
      # run may survive and skew the tests. Full cleanup.
      - name: Clean the workspace
        shell: bash
        run: git clean -ffdx

      # Node is not in the PATH of a non-login shell on the worker:
      # `~/bin` holds `node`, `npm` and `gh`.
      - name: Node tooling
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Dependencies
        shell: bash
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck (strict)
        shell: bash
        run: npm run typecheck

      - name: Tests (pure logic, no network)
        shell: bash
        run: npm test

      - name: Production build
        shell: bash
        run: npm run build

      # Size guard: < 500 lines per file, functions < 50 lines.
      - name: File and function sizes
        shell: bash
        run: node scripts/check-tokens.mjs

      # CI guards test themselves: couche0 + conflict agents.
      # Python stdlib, a few seconds, no network.
      - name: CI guard tests (couche0, agents)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
