name: couche0

# Layer 0 anti-regression. Two deterministic, nearly free checks,
# no checkout:
#   - scope:     every modified file is declared in the body's `## Scope`;
#   - forbidden: forbidden patterns in the diff + frozen guard files.
# The judge comes from `main`, never the PR head: a PR does not modify
# its own guard. Re-runnable: `gh workflow run couche0.yml -f pr=<n>`.
# The check is required: it must give its verdict on the PR as well as on
# the native merge queue's group (`gh-readonly-queue/<base>/pr-<n>-<sha>`).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Native merge queue: same check on the group’s temporary commit.
  # `merge_group` is today’s event; `push` on
  # `gh-readonly-queue/**` remains for queues built via push.
  merge_group:
  push:
    branches:
      - 'gh-readonly-queue/**'
      # NO `mergify/merge-queue/**` (removed on 31/10): the PR the queue
      # opens on its batch branch already triggers `pull_request` (types
      # `opened` / `synchronize`), so the check exists on the merged tree.
      # The extra `push` only created a second run for the same head, which
      # concurrency immediately cancelled: one more `couche0 = cancelled`
      # on the batch SHA, which Mergify could read as a failure.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to check"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Same overlap as in `ci.yml`: on a queue branch, Mergify's `push` and the
  # open PR replay the same check on the same tree. The key becomes the head
  # for these branches, so the second trigger cancels the first — never a
  # skip, which would publish a `skipped` check the queue reads as a failure.
  group: couche0-${{ (startsWith(github.ref_name, 'mergify/merge-queue/') || startsWith(github.event.pull_request.head.ref || '', 'mergify/merge-queue/')) && (github.event.pull_request.head.sha || github.sha) || github.event.pull_request.number || inputs.pr || github.ref_name }}
  cancel-in-progress: true

jobs:
  couche0:
    name: couche0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the guard from main, then check the PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # `merge_group` has no `pull_request`: the PR number lives in
          # the ref name (`refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>`).
          REF: ${{ github.event.merge_group.head_ref || github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Batch PR created by the merge queue (Mergify): this is not an author
          # PR, so its body has no `## Scope`, and its tree is exactly that
          # of PRs already judged one by one before entering the queue.
          # Judging it here would produce a false red ejecting the batch.
          case "${PR_HEAD_REF:-}" in
            mergify/merge-queue/*)
              echo "Merge queue batch PR: scope already judged on each PR — nothing to check."
              exit 0
              ;;
          esac
          if [ -z "$PR_NUMBER" ]; then
            ref="${REF#refs/heads/}"
            case "$ref" in
              */pr-*-*)
                PR_NUMBER="${ref#*pr-}"
                PR_NUMBER="${PR_NUMBER%%-*}"
                ;;
            esac
          fi
          if [ -z "$PR_NUMBER" ]; then
            case "${REF:-$GITHUB_REF_NAME}" in
              *mergify/merge-queue/*)
                echo "Mergify batch branch: scope already judged on each PR before the queue — nothing new to check here."
                ;;
              *)
                echo "::warning::no PR number reachable from this ref (${REF:-$GITHUB_REF_NAME}) — nothing to judge"
                ;;
            esac
            exit 0
          fi
          GARDE="$RUNNER_TEMP/check_couche0.py"
          recuperer() {
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/.github/couche0/check_couche0.py?ref=$1" \
              -o "$GARDE"
          }
          recuperer main || {
            echo "::warning::guard missing from main — falling back to the PR head (first landing)"
            recuperer "$HEAD_SHA"
          }
          python3 "$GARDE" check --pr "$PR_NUMBER"